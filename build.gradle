plugins {
    id 'fabric-loom' version '1.13.3'
    id 'maven-publish'
}

version = "${project.minecraft_version}-${project.mod_version}"
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // 1.21.9 起 fabric-api 聚合包的 javadoc 会让 Loom 1.11 报中间映射断言失败，
    // 改为显式依赖所需模块（同一份 API，只是不再拉 javadoc）
    modImplementation "net.fabricmc.fabric-api:fabric-api-base:1.0.5+4ebb5c083e"
    modImplementation "net.fabricmc.fabric-api:fabric-item-api-v1:11.6.0+67f17bb43e"
    modImplementation "net.fabricmc.fabric-api:fabric-item-group-api-v1:4.2.36+4fc5413f3e"
    modImplementation "net.fabricmc.fabric-api:fabric-object-builder-api-v1:21.1.40+4fc5413f3e"
    modImplementation "net.fabricmc.fabric-api:fabric-registry-sync-v0:6.2.6+1718722b3e"
}

def resourceProperties = [
        version          : project.version,
        mod_id           : project.mod_id,
        mod_name         : project.mod_name,
        mod_description  : project.mod_description,
        mod_authors      : project.mod_authors,
        mod_license      : project.mod_license,
        minecraft_version: project.minecraft_version,
        loader_version   : project.loader_version,
]

processResources {
    inputs.properties resourceProperties

    filesMatching('fabric.mod.json') {
        expand resourceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

tasks.register('showJar') {
    doLast {
        println "-> ${tasks.remapJar.archiveFile.get().asFile}"
    }
}
