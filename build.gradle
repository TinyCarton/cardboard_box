plugins {
    id 'fabric-loom' version '1.19.4'
    id 'maven-publish'
}

version = "${project.minecraft_version}-${project.mod_version}"
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered { mappings file("mappings.tiny") }
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // 26.1.2 的 fabric-api 是 Jar-in-Jar 聚合包，Loom 不会展开，这里显式依赖需要的模块
    modImplementation "net.fabricmc.fabric-api:fabric-api-base:2.0.3+ece063234c"
    modImplementation "net.fabricmc.fabric-api:fabric-item-api-v1:14.3.0+6d1aaa724c"
    modImplementation "net.fabricmc.fabric-api:fabric-object-builder-api-v1:23.1.1+abb459f14c"
    modImplementation "net.fabricmc.fabric-api:fabric-creative-tab-api-v1:5.0.12+a981f2874c"
    modImplementation "net.fabricmc.fabric-api:fabric-registry-sync-v0:7.1.1+2fa62b4e4c"
}

def resourceProperties = [
        version          : project.version,
        mod_id           : project.mod_id,
        mod_name         : project.mod_name,
        mod_description  : project.mod_description,
        mod_authors      : project.mod_authors,
        mod_license      : project.mod_license,
        minecraft_version: project.minecraft_version,
        loader_version   : project.loader_version,
]

processResources {
    inputs.properties resourceProperties

    filesMatching('fabric.mod.json') {
        expand resourceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

tasks.register('showJar') {
    doLast {
        println "-> ${tasks.remapJar.archiveFile.get().asFile}"
    }
}
