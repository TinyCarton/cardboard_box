# ===== Gradle =====
# Gradle 守护进程内存，Minecraft 反编译（NeoGradle）至少需要 3G
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# 如果你的系统默认 Java 不是 17（例如装了 JDK 21/25），把下面这行解开并改成你的 JDK 17 路径
# org.gradle.java.home=C:\\Program Files\\Java\\jdk-17

# 访问 maven.neoforged.net 需要代理时，在用户级 ~/.gradle/gradle.properties 里配：
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=1088

# ===== Mod 元数据 =====
mod_id=cardboardbox
mod_name=Cardboard Box
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.tinycarton.cardboardbox
mod_authors=TinyCarton
mod_description=Simplistic storage for moving block entities while maintaining inventories, and settings.

# ===== NeoForge / Minecraft =====
minecraft_version=1.20.2
neo_version=20.2.93
